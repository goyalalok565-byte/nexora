<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project ONE</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{
      margin:0;
      background:#04070d;
      color:white;
      font-family:Arial,Helvetica,sans-serif;
      overflow-x:hidden;
    }

    .bg{
      position:fixed;
      inset:0;
      background:
      radial-gradient(circle at top,#2563eb55,transparent 45%),
      radial-gradient(circle at bottom,#7c3aed33,transparent 45%),
      #04070d;
      z-index:-1;
    }

    nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:22px 8%;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#60a5fa;
    }

    .btn{
      background:#2563eb;
      padding:12px 22px;
      border-radius:14px;
      text-decoration:none;
      color:white;
      font-weight:bold;
      transition:.3s;
    }

    .btn:hover{
      transform:translateY(-2px);
      background:#3b82f6;
    }

    .hero{
      min-height:80vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:40px;
    }

    h1{
      font-size:58px;
      line-height:1.1;
      margin-bottom:20px;
    }

    p{
      color:#b6c2d1;
      max-width:700px;
      margin:auto;
      font-size:20px;
      line-height:1.7;
    }

    .buttons{
      margin-top:40px;
      display:flex;
      justify-content:center;
      gap:18px;
      flex-wrap:wrap;
    }

    .glass{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(18px);
    }

    .secondary{
      background:transparent;
      border:1px solid #2d3748;
    }

  </style>
</head>

<body>

<div class="bg"></div>

<nav>

<div class="logo">
PROJECT ONE
</div>

<div>
<a class="btn secondary" href="#">Vision</a>
<a class="btn" href="#">Start Building</a>
</div>

</nav>

<section class="hero">

<div>

<h1>
Build What Doesn't Exist.
</h1>

<p>

Create products, inventions and future startups using one intelligent workspace.

</p>

<div class="buttons">

<a class="btn" href="#">
Start Free
</a>

<a class="btn secondary" href="#">
Watch Demo
</a>

</div>

</div>

</section>

</body>
</html>
