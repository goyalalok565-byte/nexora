<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura — Your AI Friend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #090d16; color: #f8fafc; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .mic-pulse { animation: pulse-ring 2s infinite ease-in-out; }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.6); }
            70% { box-shadow: 0 0 0 25px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white p-4">

    <!-- Header -->
    <header class="p-3 flex justify-between items-center max-w-md mx-auto w-full">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-heart text-white text-sm"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-base tracking-tight leading-none text-white">Aura</h1>
                <p class="text-[10px] text-indigo-300 font-medium">Your Safe Space</p>
            </div>
        </div>
        <span class="glass-card px-3 py-1 rounded-full text-[10px] text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Active
        </span>
    </header>

    <!-- Main Call UI Area -->
    <main class="flex-1 max-w-md mx-auto w-full flex flex-col items-center justify-center gap-6 text-center my-4">
        
        <div class="space-y-1">
            <span id="callStatus" class="text-xs font-semibold tracking-wider text-indigo-300 uppercase bg-indigo-950/60 border border-indigo-800/50 px-3.5 py-1.5 rounded-full">
                Tap Mic or Type Below
            </span>
        </div>

        <!-- Central Orb / Mic Button -->
        <div class="relative my-2">
            <button id="micBtn" onclick="toggleVoiceSession()" class="w-32 h-32 rounded-full bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-white text-3xl shadow-2xl shadow-indigo-500/30 transition-all duration-300 active:scale-95">
                <i id="micIcon" class="fa-solid fa-microphone"></i>
            </button>
        </div>

        <!-- Conversation Box -->
        <div class="w-full glass-card p-4 rounded-3xl space-y-3 text-left shadow-xl">
            <div>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-0.5">Aapne Kaha</p>
                <p id="userTranscript" class="text-xs text-slate-300 italic min-h-[20px]">"Tap mic to speak or type..."</p>
            </div>
            <hr class="border-slate-800">
            <div>
                <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-0.5 flex items-center gap-1">
                    <i class="fa-solid fa-sparkles"></i> Aura
                </p>
                <p id="auraReply" class="text-xs text-white font-medium leading-relaxed min-h-[36px]">
                    Hey! Main Aura hoon. Aaj aapka din kaisa gaya?
                </p>
            </div>
        </div>

        <!-- Text Input Fallback (Always Works) -->
        <div class="w-full flex gap-2">
            <input type="text" id="textInput" placeholder="Aura se yahan bhi baat kar sakte hain..." class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
            <button onclick="sendTextMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-3 rounded-2xl text-xs font-bold transition">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

    </main>

    <footer class="text-center text-[11px] text-slate-600">
        Aura AI Companion • Always Here To Listen
    </footer>

    <!-- LOGIC ENGINE -->
    <script>
        let isListening = false;
        let recognition;
        const synth = window.speechSynthesis;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'hi-IN';

            recognition.onstart = function() {
                isListening = true;
                document.getElementById('micBtn').classList.add('mic-pulse');
                document.getElementById('callStatus').innerText = "Aura Listening...";
            };

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                document.getElementById('userTranscript').innerText = `"${text}"`;
                processUserSpeech(text);
            };

            recognition.onerror = function(e) {
                stopListeningState();
                console.log("Speech error:", e);
            };

            recognition.onend = function() {
                stopListeningState();
            };
        }

        function toggleVoiceSession() {
            if (!SpeechRecognition) {
                alert("Voice recognition blocked. Please type in the text box below.");
                return;
            }
            if (isListening) {
                recognition.stop();
                stopListeningState();
            } else {
                try {
                    synth.cancel();
                    recognition.start();
                } catch(err) {
                    console.log(err);
                }
            }
        }

        function stopListeningState() {
            isListening = false;
            document.getElementById('micBtn').classList.remove('mic-pulse');
            document.getElementById('callStatus').innerText = "Tap Mic To Speak";
        }

        function sendTextMessage() {
            const input = document.getElementById('textInput');
            const text = input.value.trim();
            if(text) {
                document.getElementById('userTranscript').innerText = `"${text}"`;
                processUserSpeech(text);
                input.value = '';
            }
        }

        // Enter Key Listener
        document.getElementById('textInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendTextMessage();
        });

        function processUserSpeech(userMessage) {
            const msg = userMessage.toLowerCase();
            let reply = "";

            if (msg.includes("akela") || msg.includes("lonely") || msg.includes("koi nahi")) {
                reply = "Aap akele nahi hain... Main hoon na aapke saath. Jab bhi dil heavy ho, bas mujhe bula liya kijiye. Bataiye, kya baat hui?";
            } else if (msg.includes("bura") || msg.includes("sad") || msg.includes("udaas") || msg.includes("kharab")) {
                reply = "Oh... Mujhe dukh hua ye sun kar. Aaj ka din zaroor mushkil raha hoga. Agar aapka man kare toh saari baat batao, main dhyan se sun rahi hoon.";
            } else if (msg.includes("hi") || msg.includes("hello") || msg.includes("hey")) {
                reply = "Hey! Main Aura hoon. Aap se baat karke bohot achha laga. Aaj aapka din kaisa bita?";
            } else {
                reply = "Hmm... Main aapki baat acche se samajh rahi hoon. Aap mujhse bina kisi darr ke sab share kar sakte hain. Aage kya hua?";
            }

            document.getElementById('auraReply').innerText = reply;
            speakResponse(reply);
        }

        function speakResponse(text) {
            if ('speechSynthesis' in window) {
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.pitch = 1.1;
                utterance.rate = 0.95;
                synth.speak(utterance);
            }
        }
    </script>
</body>
</html>
